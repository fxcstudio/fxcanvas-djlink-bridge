name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '11'
          cache: maven
      - name: Check tag matches pom version
        run: |
          version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match pom version ${version}"; exit 1; }
          grep -q "VERSION = \"${version}\"" src/main/java/studio/fxc/djlink/BridgeVersion.java || { echo "BridgeVersion.VERSION is not ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: ./mvnw -B verify
      - name: Package release assets
        run: |
          cd target
          jar="fxc-djlink-bridge-${VERSION}.jar"
          sha256sum "$jar" > "$jar.sha256"
          (cd third-party-sources && zip -q -r ../third-party-sources.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/fxc-djlink-bridge-${{ env.VERSION }}.jar
            target/fxc-djlink-bridge-${{ env.VERSION }}.jar.sha256
            target/third-party-sources.zip
